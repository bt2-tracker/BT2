# Bygger nettversjonen og Windows-programmet av BerntTracker II og legger dem ut på GitHub Pages
# hver gang noe sendes til GitHub (Commit + Sync). Windows-programmet havner i windows/ på nettsiden,
# og programmet henter oppdateringer derfra.
name: Nettversjon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EMSDK_VERSION: 3.1.52
  SDL_TAG: release-2.30.12
  # Windows-programmet bygges på Linux med llvm-mingw (verktoy/bygg-windows.sh). Faste versjoner med
  # sjekksum, så programmet blir byte for byte likt når koden er lik.
  LLVM_MINGW: llvm-mingw-20241217-ucrt-ubuntu-20.04-x86_64
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20241217/llvm-mingw-20241217-ucrt-ubuntu-20.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cfe4aac3d245a77d8cd0c41bdcd7971b1002c771d3bba2ac39702733b0fb0c12
  SDL_WIN_URL: https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.tar.gz
  SDL_WIN_SHA256: 83a5d74012311edc3c0d40ea6faecbe57ad692aa033fa5dc273cc937e3938ff2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Hent bygget SDL2 fra cache
        id: sdlcache
        uses: actions/cache@v4
        with:
          path: |
            sdl-web
            sdl-compat
          key: sdl-web-${{ env.SDL_TAG }}-${{ env.EMSDK_VERSION }}-v2

      - name: Bygg SDL2 for nett (to varianter)
        if: steps.sdlcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git sdl-src
          # lavforsinkelse-motoren: delt minne (atomics)
          emcmake cmake -S sdl-src -B sdl-build -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DSDL_THREADS=OFF -DSDL_PTHREADS=OFF \
            -DCMAKE_C_FLAGS="-matomics -mbulk-memory" -DCMAKE_INSTALL_PREFIX="$PWD/sdl-web"
          cmake --build sdl-build -j4
          cmake --install sdl-build
          # kompatibel motor: uten delt minne (Safari godtar ikke atomics da)
          emcmake cmake -S sdl-src -B sdl-build-compat -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DSDL_THREADS=OFF -DSDL_PTHREADS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl-compat"
          cmake --build sdl-build-compat -j4
          cmake --install sdl-build-compat

      - name: Bygg Bernttracker II
        run: |
          bash web/build_web.sh "$PWD/sdl-web" "$PWD/sdl-compat" "$PWD/site"
          touch site/.nojekyll
          ls -la site

      - name: Hent verktøy for Windows-programmet fra cache
        id: wincache
        uses: actions/cache@v4
        with:
          path: wintools-dl
          key: wintools-${{ env.LLVM_MINGW_SHA256 }}-${{ env.SDL_WIN_SHA256 }}

      - name: Last ned verktøy for Windows-programmet
        if: steps.wincache.outputs.cache-hit != 'true'
        run: |
          mkdir -p wintools-dl
          curl -sSfL --retry 3 -o wintools-dl/llvm-mingw.tar.xz "$LLVM_MINGW_URL"
          curl -sSfL --retry 3 -o wintools-dl/sdl2-mingw.tar.gz "$SDL_WIN_URL"

      - name: Bygg Windows-programmet
        run: |
          echo "$LLVM_MINGW_SHA256  wintools-dl/llvm-mingw.tar.xz" | sha256sum -c -
          echo "$SDL_WIN_SHA256  wintools-dl/sdl2-mingw.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wintools"
          tar -xJf wintools-dl/llvm-mingw.tar.xz -C "$RUNNER_TEMP/wintools"
          tar -xzf wintools-dl/sdl2-mingw.tar.gz -C "$RUNNER_TEMP/wintools"
          bash verktoy/bygg-windows.sh "$RUNNER_TEMP/wintools/$LLVM_MINGW" \
            "$RUNNER_TEMP/wintools/SDL2-2.32.10/x86_64-w64-mingw32" "$RUNNER_TEMP/winbuild" "$PWD/site/windows"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
